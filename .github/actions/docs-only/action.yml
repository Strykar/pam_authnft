# Decide whether a pull request touches documentation and nothing else.
#
# Callers use this to skip expensive steps, never to skip the job or the
# workflow. That distinction matters: a workflow held back by a `paths` or
# `paths-ignore` filter never reports its check at all, and a required check
# that never reports sits at "Expected — waiting" forever, so a docs-only PR
# can never be merged. Keeping the job running and guarding its steps means
# the check still reports, it just reports in seconds.
#
# Requires the caller to check out with fetch-depth: 0 so the base commit is
# present to diff against.

name: docs-only
description: True when a pull request changes documentation and nothing else.

outputs:
  result:
    description: "'true' when every file the PR touches is documentation"
    value: ${{ steps.detect.outputs.result }}

runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
      run: |
        set -euo pipefail

        # Anything not on this list counts as code. A path nobody anticipated
        # makes the job run in full; skipping has to be earned by matching.
        # Note docs/THIRD_PARTY.md is documentation here, which is why
        # third-party.yml does not use this action: its gate reads that file,
        # so a doc edit really can flip it.
        DOCS='^(docs/|[^/]+\.md$|LICENSE$)'

        # Pushes to main, dispatches and crons have no PR to diff against.
        if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "result=false" >> "$GITHUB_OUTPUT"
            exit 0
        fi

        changed=$(git diff --name-only "$BASE_SHA" HEAD)
        if [ -z "$changed" ]; then
            echo "result=false" >> "$GITHUB_OUTPUT"
            exit 0
        fi

        if printf '%s\n' "$changed" | grep -qvE "$DOCS"; then
            echo "result=false" >> "$GITHUB_OUTPUT"
            echo "Code changed. Running in full:"
            printf '%s\n' "$changed" | grep -vE "$DOCS" | sed 's/^/  /'
        else
            echo "result=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Documentation-only change. The expensive steps in this job are skipped; the check still reports."
            printf '%s\n' "$changed" | sed 's/^/  /'
        fi
