name: analyze
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

# Clang static analyzer (scan-build) as a fast PR gate. cppcheck is
# path-insensitive and CodeQL is differently tuned; the one leak this
# project has shipped (CID 1659576, frag_buf in nft_handler_setup) was
# found by scan-build run by hand, and by Coverity a week later — nothing
# blocked it on the PR. scan-build's path-sensitive unix.Malloc/unix.cstring
# checkers run in well under a minute here and would have. (GCC -fanalyzer
# was evaluated and does NOT flag this leak; clang's analyzer does.)
concurrency:
  # One in-flight run per PR (github.ref is refs/pull/<n>/merge on a PR, so
  # PRs never cancel each other and push-to-main sits in its own group). The
  # cancel only fires for pull_request events, so a push to main or a cron run
  # is never interrupted mid-flight. Workflow-level, not job-level: a matrix
  # job with a matrix-blind group key would cancel its own sibling leg and
  # report 'cancelled' on the head SHA, which branch protection blocks on.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install clang analyzer + deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang clang-tools pkg-config \
            libnftables-dev libseccomp-dev libsystemd-dev libpam0g-dev libcap-dev libaudit-dev
      - name: scan-build (fail on any analyzer bug)
        run: make analyze

  # Static analysis of the workflows themselves, plus the one piece of
  # workflow logic that has real behaviour to test. CodeQL's actions pack
  # (codeql.yml) already looks for template injection. zizmor adds the checks
  # it does not carry: pinning policy, per-job permissions, and credentials
  # left behind by checkout. Its online audits also compare each hash pin
  # against the tag the version comment claims, which is how the stale
  # codeql-action comments in this repo were found. Seconds, not minutes, so
  # it belongs in the fast gate rather than in a workflow of its own.
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # zizmor-action uploads its SARIF to the Security tab.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      # Two passes on purpose. zizmor exits 0 in SARIF mode no matter what it
      # finds (documented, and measured here: 14 in plain, json and github
      # output, 0 in sarif), so the pass that feeds the Security tab can
      # never fail the job. The second pass is the gate. A config error
      # exits 1 in every mode, so a broken zizmor.yml still turns this red.
      - name: zizmor (SARIF to the Security tab)
        # Reads .github/zizmor.yml. The zizmor version and its container
        # digest come from the pinned action commit, so the audit set only
        # moves when dependabot bumps that pin.
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
      - name: zizmor (fail the job on findings)
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          annotations: true

      # fuzz-nightly's crash reporter only runs on a night a harness crashes,
      # which is a bad time to find out it is broken, and exercising it for
      # real files an issue on the repo. This runs the script out of the
      # workflow file against fixture artefacts with the API stubbed.
      - name: The nightly crash reporter still reports
        run: node tests/ci/fuzz-report-test.js
