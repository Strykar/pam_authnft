name: build
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

concurrency:
  # One in-flight run per PR (github.ref is refs/pull/<n>/merge on a PR, so
  # PRs never cancel each other and push-to-main sits in its own group). The
  # cancel only fires for pull_request events, so a push to main or a cron run
  # is never interrupted mid-flight. Workflow-level, not job-level: a matrix
  # job with a matrix-blind group key would cancel its own sibling leg and
  # report 'cancelled' on the head SHA, which branch protection blocks on.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    runs-on: ubuntu-latest
    env:
      CC: ${{ matrix.compiler }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config checksec \
            libnftables-dev libseccomp-dev libsystemd-dev libpam0g-dev libcap-dev libaudit-dev
      - name: Build
        run: make CC=${{ matrix.compiler }}
      - name: Unit tests (no root)
        run: make CC=${{ matrix.compiler }} test
