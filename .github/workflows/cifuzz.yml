name: CIFuzz
# Fuzzes committed code, not proposed code. PR fuzzing was an 8-minute
# wall on every code PR and bought little over the nightly
# (fuzz-nightly.yml runs longer with a persistent corpus and files
# issues on crashes) and the per-PR coverage gate (fuzz-coverage.yml).
# Instead every commit that lands on main is fuzzed post-merge, where
# it blocks nothing.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Leak detection requires ptrace which GitHub Actions runners deny.
# Disable it so ASan does not abort before the fuzzer finishes its run.
env:
  ASAN_OPTIONS: detect_leaks=0

concurrency:
  # One in-flight run per PR (github.ref is refs/pull/<n>/merge on a PR, so
  # PRs never cancel each other and push-to-main sits in its own group). The
  # cancel only fires for pull_request events, so a push to main or a cron run
  # is never interrupted mid-flight. Workflow-level, not job-level: a matrix
  # job with a matrix-blind group key would cancel its own sibling leg and
  # report 'cancelled' on the head SHA, which branch protection blocks on.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the scope probe below diffs against the PR base

      - id: scope
        uses: ./.github/actions/fuzz-scope

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config \
            libnftables-dev libseccomp-dev libsystemd-dev libpam0g-dev libcap-dev libaudit-dev

      - name: Build fuzz targets
        if: steps.scope.outputs.relevant == 'true'
        run: make fuzz

      - name: Fuzz util_is_valid_username + util_normalize_ip (60s)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          mkdir -p tests/fuzz/corpus/username tests/fuzz/crashes
          ./tests/fuzz/out/fuzz_username \
            -max_total_time=60 \
            -artifact_prefix=tests/fuzz/crashes/username- \
            tests/fuzz/corpus/username/

      - name: Fuzz validate_fragment_content (60s)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          mkdir -p tests/fuzz/corpus/fragment tests/fuzz/crashes
          ./tests/fuzz/out/fuzz_fragment \
            -max_total_time=60 \
            -artifact_prefix=tests/fuzz/crashes/fragment- \
            tests/fuzz/corpus/fragment/

      - name: Fuzz substitute_placeholders (60s)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          mkdir -p tests/fuzz/corpus/substitute_placeholders tests/fuzz/crashes
          ./tests/fuzz/out/fuzz_substitute_placeholders \
            -max_total_time=60 \
            -artifact_prefix=tests/fuzz/crashes/substitute_placeholders- \
            tests/fuzz/corpus/substitute_placeholders/

      - name: Fuzz peer_parse_diag_chunk (60s)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          mkdir -p tests/fuzz/corpus/netlink_diag tests/fuzz/crashes
          ./tests/fuzz/out/fuzz_netlink_diag \
            -max_total_time=60 \
            -artifact_prefix=tests/fuzz/crashes/netlink_diag- \
            tests/fuzz/corpus/netlink_diag/

      - name: Fuzz keyring_sanitize (60s)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          mkdir -p tests/fuzz/corpus/keyring_sanitize tests/fuzz/crashes
          ./tests/fuzz/out/fuzz_keyring_sanitize \
            -max_total_time=60 \
            -artifact_prefix=tests/fuzz/crashes/keyring_sanitize- \
            tests/fuzz/corpus/keyring_sanitize/

      - name: Fuzz corr_sanitize_copy (60s)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          mkdir -p tests/fuzz/corpus/correlation_capture tests/fuzz/crashes
          ./tests/fuzz/out/fuzz_correlation_capture \
            -max_total_time=60 \
            -artifact_prefix=tests/fuzz/crashes/correlation_capture- \
            tests/fuzz/corpus/correlation_capture/

      - name: Fuzz validate_cgroup_path (60s)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          mkdir -p tests/fuzz/corpus/cgroup_path tests/fuzz/crashes
          ./tests/fuzz/out/fuzz_cgroup_path \
            -max_total_time=60 \
            -artifact_prefix=tests/fuzz/crashes/cgroup_path- \
            tests/fuzz/corpus/cgroup_path/

      - name: Fuzz parse_socket_inode (60s)
        if: steps.scope.outputs.relevant == 'true'
        run: |
          mkdir -p tests/fuzz/corpus/socket_inode tests/fuzz/crashes
          ./tests/fuzz/out/fuzz_socket_inode \
            -max_total_time=60 \
            -artifact_prefix=tests/fuzz/crashes/socket_inode- \
            tests/fuzz/corpus/socket_inode/

      - name: Upload crash artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: fuzz-crashes
          path: tests/fuzz/crashes/
