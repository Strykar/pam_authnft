name: docs-drift

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # One in-flight run per PR (github.ref is refs/pull/<n>/merge on a PR, so
  # PRs never cancel each other and push-to-main sits in its own group). The
  # cancel only fires for pull_request events, so a push to main or a cron run
  # is never interrupted mid-flight. Workflow-level, not job-level: a matrix
  # job with a matrix-blind group key would cancel its own sibling leg and
  # report 'cancelled' on the head SHA, which branch protection blocks on.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs-drift:
    # Docs rot in ways grep can see. This project shipped that rot twice: a
    # README telling operators to uncomment systemd sandboxing a .slice
    # silently ignores, and a whole CI tier deleted while docs still pointed
    # at it. Both were greppable, so grep for them here. It does not check
    # whether prose is true — only that it does not reference things that no
    # longer exist. See tests/ci/docs-drift-check.sh.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Docs reference nothing that has been deleted
        run: ./tests/ci/docs-drift-check.sh
