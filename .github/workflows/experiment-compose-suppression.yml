name: experiment-compose-suppression
# Throwaway workflow for the mull+ASan stack-instrumentation
# suppression investigation. Runs on the
# experiment/mull-asan-compose-suppression branch only; deleted
# with the branch after the investigation's writeup commits to
# main (docs/MUTATION_ASAN_INVESTIGATION_2.md).
#
# Per-run variables (pass-plugin CLI order, heap vs stack,
# sanitiser flags, optimisation level, mutator filter) change
# between commits on the experiment branch rather than via
# workflow_dispatch inputs — keeps each run a one-line commit
# diff and an auditable git log.
#
# Build is inline rather than Makefile-target-based because the
# stub binary is throwaway; adding a target would land on main
# via the wrong path.
on:
  push:
    branches:
      - experiment/mull-asan-compose-suppression
    paths:
      - 'experiment/stub_compose_suppression.c'
      - 'experiment/test_compose_suppression.c'
      - '.github/workflows/experiment-compose-suppression.yml'
      - 'mull.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MULL_LLVM_MAJOR: '19'

jobs:
  experiment-compose-suppression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install build dependencies
        run: |
          # Run 4a reverts to the bare stub; the production-header
          # cluster from run 3 is not needed. Only the mull repo
          # install dependencies remain.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl gnupg ca-certificates

      - name: Install mull and matching clang
        run: |
          curl -1sLf "https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh" \
              -o /tmp/mull-repo.sh
          test "$(wc -l < /tmp/mull-repo.sh)" -lt 1000
          sudo -E bash /tmp/mull-repo.sh
          sudo apt-get install -y \
              "mull-${MULL_LLVM_MAJOR}" "clang-${MULL_LLVM_MAJOR}"
          "mull-runner-${MULL_LLVM_MAJOR}" --version

      - name: Build stub_compose_suppression.mull (run 5b — UBSan re-added, bare stub)
        run: |
          # Run 5b: re-add -fsanitize=undefined to the bare stub.
          # Run 4a falsified H0-as-originally-stated; H0' (the
          # production suppression that 4a does not reproduce) is
          # open. Bisect additively from 4a toward production, one
          # variable per run. 5b adds back the variable 4a dropped
          # for signal isolation.
          #
          # Single-flag, single-variable diff from 4a:
          #   -fsanitize=address → -fsanitize=address,undefined
          # in both compile and link. Nothing else changes.
          #
          # Bare flags otherwise: no HARDENING, no _FORTIFY_SOURCE,
          # -O0. Test file unchanged (decoupled from per-build
          # interpretation; verdict mapping lives here).
          #
          # Verdict for line-51 cxx_ge_to_gt (filter SQLite by
          # line_number = 51 AND mutator = 'cxx_ge_to_gt'). Pre-
          # stated as (status_code, stderr_content) pairs, not as
          # status-name semantics:
          #
          #   (2, empty):
          #     Mutant survived. H0' candidate, narrowed by 5b's
          #     variables: mull+ASan+UBSan compose at -O0 with no
          #     HARDENING suppresses both sanitisers' runtime
          #     checks on stack OOB writes. Further hedges may
          #     apply depending on which subsequent runs confirm
          #     or narrow the carrier.
          #
          #   (1, "AddressSanitizer: stack-buffer-overflow" +
          #       "ABORTING", no UBSan diagnostic):
          #     ASan tripped, UBSan did not preempt. UBSan-in-
          #     compose is not the H0' carrier in the bare stub.
          #     Advance to 5a-split (HARDENING per-flag) or 5c (TU
          #     expansion).
          #
          #   (1, "runtime error:" or "UndefinedBehaviorSanitizer"
          #       diagnostic, no ASan diagnostic):
          #     UBSan tripped, preempted ASan. ASan suppression
          #     status not determined by this run alone. Pre-
          #     planned follow-up 5b': drop abort_on_error from
          #     UBSAN_OPTIONS so UBSan logs but doesn't terminate,
          #     letting ASan get a turn. 5b' has its own verdict
          #     mapping, written before firing, not inherited.
          #
          #   (1, BOTH diagnostics as cleanly separated blocks):
          #     First complete diagnostic block by line order of
          #     the "ERROR:" or "runtime error:" anchor determines
          #     kill attribution. Second block is evidence the
          #     second sanitiser was not suppressed at this site.
          #
          #   (1, INTERLEAVED diagnostics: lines from both mixed
          #       beyond clean block separation):
          #     Attribution not safe from this run. Stderr writes
          #     are not atomically synchronised across sanitiser
          #     handlers writing on the same fault. Treat as the
          #     "needs follow-up" case (see 5b' above) rather than
          #     guessing first-fired.
          #
          #   (4, _), (5, _), (3, _):
          #     Different mull encoding for some kill condition.
          #     Attribute from stderr column, not from status
          #     name. 4a established status=1 + exit_status=-1 is
          #     mull-0.34's encoding for signal-terminated;
          #     status=4 is some narrower condition not yet
          #     characterised.
          #
          # Line-47 prediction: cxx_ge_to_gt and cxx_ge_to_lt
          # expected to remain status=2 survivors (equivalent on
          # this test surface regardless of which sanitiser fires
          # at line 51). Post-run check: confirm line-47 status
          # did not flip between 4a and 5b. A flip would be a
          # surprising result this verdict mapping does not
          # enumerate; re-examine before interpreting H0'.
          CLANG="clang-${MULL_LLVM_MAJOR}"
          PLUGIN="/usr/lib/mull-ir-frontend-${MULL_LLVM_MAJOR}"
          CFLAGS="-fpass-plugin=$PLUGIN -fsanitize=address,undefined -fno-omit-frame-pointer -g -grecord-command-line -O0"
          $CLANG $CFLAGS -c experiment/stub_compose_suppression.c -o /tmp/stub_compose.mull.o
          $CLANG $CFLAGS -c experiment/test_compose_suppression.c -o /tmp/test_compose.mull.o
          $CLANG -fsanitize=address,undefined -fno-omit-frame-pointer \
              /tmp/stub_compose.mull.o /tmp/test_compose.mull.o \
              -o stub_compose_suppression.mull

      - name: Run mull-runner
        id: mull
        env:
          ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:print_summary=1"
          UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1:print_summary=1"
        run: |
          set +e
          "mull-runner-${MULL_LLVM_MAJOR}" \
              --ide-reporter-show-killed \
              --minimum-timeout 5000 \
              --reporters IDE --reporters SQLite \
              --report-dir . \
              --report-name compose-suppression \
              ./stub_compose_suppression.mull > mutation-report.txt 2>&1
          ec=$?
          set -e
          echo "exit=$ec" >> "$GITHUB_OUTPUT"
          {
            echo "## compose-suppression mutation report"
            echo
            echo '```'
            tail -200 mutation-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Query SQLite — survivors, crashes, mutator distribution
        if: always()
        run: |
          if [ ! -f compose-suppression.sqlite ]; then
            echo "::error::compose-suppression.sqlite missing"
            exit 1
          fi
          echo "=== status distribution ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT execution_status, COUNT(*) FROM mutant GROUP BY execution_status ORDER BY execution_status;"
          echo
          echo "=== survivors (status=2): mutator, line, column ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT mutator, line_number, column_number, mutation_replacement FROM mutant WHERE execution_status = 2;"
          echo
          echo "=== crashed (status=4): mutator, line, column ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT mutator, line_number, column_number, mutation_replacement FROM mutant WHERE execution_status = 4;"
          echo
          echo "=== ALL mutants for reference ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT execution_status, mutator, line_number, column_number FROM mutant ORDER BY line_number, column_number;"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compose-suppression-report
          path: |
            mutation-report.txt
            compose-suppression*.sqlite
            compose-suppression*.txt
          retention-days: 30
          if-no-files-found: warn
