name: experiment-compose-suppression
# Throwaway workflow for the mull+ASan stack-instrumentation
# suppression investigation. Runs on the
# experiment/mull-asan-compose-suppression branch only; deleted
# with the branch after the investigation's writeup commits to
# main (docs/MUTATION_ASAN_INVESTIGATION_2.md).
#
# Per-run variables (pass-plugin CLI order, heap vs stack,
# sanitiser flags, optimisation level, mutator filter) change
# between commits on the experiment branch rather than via
# workflow_dispatch inputs — keeps each run a one-line commit
# diff and an auditable git log.
#
# Build is inline rather than Makefile-target-based because the
# stub binary is throwaway; adding a target would land on main
# via the wrong path.
on:
  push:
    branches:
      - experiment/mull-asan-compose-suppression
    paths:
      - 'experiment/stub_compose_suppression.c'
      - 'experiment/test_compose_suppression.c'
      - '.github/workflows/experiment-compose-suppression.yml'
      - 'mull.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MULL_LLVM_MAJOR: '19'

jobs:
  experiment-compose-suppression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install build dependencies
        run: |
          # Run 4a reverts to the bare stub; the production-header
          # cluster from run 3 is not needed. Only the mull repo
          # install dependencies remain.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl gnupg ca-certificates

      - name: Install mull and matching clang
        run: |
          curl -1sLf "https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh" \
              -o /tmp/mull-repo.sh
          test "$(wc -l < /tmp/mull-repo.sh)" -lt 1000
          sudo -E bash /tmp/mull-repo.sh
          sudo apt-get install -y \
              "mull-${MULL_LLVM_MAJOR}" "clang-${MULL_LLVM_MAJOR}"
          "mull-runner-${MULL_LLVM_MAJOR}" --version

      - name: Build stub_compose_suppression.mull (run 5b' — UBSan log-and-continue)
        run: |
          # Run 5b': pre-planned follow-up to 5b. 5b confirmed UBSan
          # trips on core[in_len] before ASan gets a turn (status=1
          # with single UBSan diagnostic, no ASan output, no
          # "ABORTING" terminator). ASan suppression status was
          # undetermined — UBSan preempted on the way through.
          #
          # 5b' resolves the preemption: UBSAN_OPTIONS halt_on_error
          # flips from 1 to 0 in the mull-runner env so UBSan logs
          # the bounds-check failure and execution continues past
          # the access site. The write at core[in_len] = '\0' then
          # proceeds; if ASan is not suppressed, its red-zone check
          # fires on the same write. Single-variable diff from 5b
          # (UBSAN_OPTIONS only — build flags unchanged).
          #
          # Build-flag audit (confirm no override of UBSan's
          # default recover-handler behaviour, same shape as the
          # _FORTIFY_SOURCE audit before run 4a):
          #   - No -fno-sanitize-recover anywhere in the workflow
          #     or Makefile (grep verified pre-push).
          #   - No -fsanitize-trap=undefined or
          #     -fsanitize-undefined-trap-on-error anywhere.
          #   - Build is per-file inline clang in this workflow,
          #     not through the Makefile, so no CFLAGS_BASE
          #     inheritance.
          # Clang's defaults for -fsanitize=undefined are
          # recover-handler-on and no-trap, so UBSAN_OPTIONS
          # halt_on_error=0 will be honored.
          #
          # Verdict for line-51 cxx_ge_to_gt (filter SQLite by
          # line_number = 51 AND mutator = 'cxx_ge_to_gt'). Pre-
          # stated as (status_code, stderr_content) pairs:
          #
          #   (2, stderr contains UBSan diagnostic only, no ASan):
          #     UBSan logged, execution continued, ASan did not
          #     trip on the write. ASan suppression CONFIRMED. H0'
          #     candidate (narrowed by 5b's build variables):
          #     mull+ASan+UBSan compose at -O0 with no HARDENING
          #     suppresses ASan stack-instrumentation specifically;
          #     UBSan's bounds-check instrumentation is NOT
          #     suppressed. This is a stopping point for the
          #     bisection — production-reproduction (run 3) has a
          #     partial explanation; the next investigation layer
          #     is "why does UBSan's bounds check not always fire
          #     in production" rather than continuation of the
          #     current additive bisection.
          #
          #   (1, UBSan diagnostic followed by AddressSanitizer
          #       block + "ABORTING"):
          #     UBSan logged, ASan tripped on the subsequent
          #     write. Neither sanitiser is suppressed in the bare
          #     stub. UBSan-in-compose is NOT the H0' carrier.
          #     Advance to 5a-split (HARDENING per-flag: 5a-stkprot,
          #     5a-autovarinit, 5a-stkclash, 5a-cfprot — four
          #     single-variable runs, each with its own pre-stated
          #     verdict mapping written before firing).
          #
          #   (1, UBSan diagnostic only + SIGABRT, no ASan):
          #     UBSan logged but the process aborted anyway
          #     despite halt_on_error=0. Investigate. Possible
          #     mechanisms: clang version-specific default
          #     overrides the runtime option, an inherited
          #     compile-time recover/trap flag the audit missed,
          #     or a UBSan handler behaviour for this specific
          #     check (bounds) that doesn't honor halt_on_error.
          #     Not interpretable as H0' evidence until the abort
          #     mechanism is identified.
          #
          #   (2, stderr empty — neither sanitiser fired):
          #     UBSan-in-compose IS the H0' carrier (its bounds
          #     check fired in 5b but not in 5b' — same code path,
          #     only difference is halt_on_error). Two sub-cases:
          #     (a) UBSAN_OPTIONS environment suppressing the
          #         diagnostic too — investigate UBSAN_OPTIONS
          #         interactions.
          #     (b) Build flag (e.g. inherited -fsanitize-trap
          #         the audit missed) suppressing the diagnostic
          #         at compile time — rebuild with explicit
          #         -fno-sanitize-trap and re-run.
          #
          #   (1, INTERLEAVED diagnostics: lines mixed beyond
          #       clean block separation):
          #     Same as 5b: needs follow-up rather than guessing
          #     first-fired.
          #
          #   (4, _), (5, _), (3, _):
          #     Attribute from stderr column, not from status
          #     name.
          #
          # Line-47 prediction: cxx_ge_to_gt AND cxx_ge_to_lt
          # both expected to remain status=2 with empty stderr in
          # 5b' (parity, same as 4a and 5b). Post-run check both
          # mutators; a divergence between them at line-47 (one
          # flips status, the other doesn't) is a surprising
          # result the verdict mapping does not enumerate.
          CLANG="clang-${MULL_LLVM_MAJOR}"
          PLUGIN="/usr/lib/mull-ir-frontend-${MULL_LLVM_MAJOR}"
          CFLAGS="-fpass-plugin=$PLUGIN -fsanitize=address,undefined -fno-omit-frame-pointer -g -grecord-command-line -O0"
          $CLANG $CFLAGS -c experiment/stub_compose_suppression.c -o /tmp/stub_compose.mull.o
          $CLANG $CFLAGS -c experiment/test_compose_suppression.c -o /tmp/test_compose.mull.o
          $CLANG -fsanitize=address,undefined -fno-omit-frame-pointer \
              /tmp/stub_compose.mull.o /tmp/test_compose.mull.o \
              -o stub_compose_suppression.mull

      - name: Run mull-runner
        id: mull
        env:
          ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:print_summary=1"
          UBSAN_OPTIONS: "halt_on_error=0:print_stacktrace=1:print_summary=1"
        run: |
          set +e
          "mull-runner-${MULL_LLVM_MAJOR}" \
              --ide-reporter-show-killed \
              --minimum-timeout 5000 \
              --reporters IDE --reporters SQLite \
              --report-dir . \
              --report-name compose-suppression \
              ./stub_compose_suppression.mull > mutation-report.txt 2>&1
          ec=$?
          set -e
          echo "exit=$ec" >> "$GITHUB_OUTPUT"
          {
            echo "## compose-suppression mutation report"
            echo
            echo '```'
            tail -200 mutation-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Query SQLite — survivors, crashes, mutator distribution
        if: always()
        run: |
          if [ ! -f compose-suppression.sqlite ]; then
            echo "::error::compose-suppression.sqlite missing"
            exit 1
          fi
          echo "=== status distribution ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT execution_status, COUNT(*) FROM mutant GROUP BY execution_status ORDER BY execution_status;"
          echo
          echo "=== survivors (status=2): mutator, line, column ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT mutator, line_number, column_number, mutation_replacement FROM mutant WHERE execution_status = 2;"
          echo
          echo "=== crashed (status=4): mutator, line, column ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT mutator, line_number, column_number, mutation_replacement FROM mutant WHERE execution_status = 4;"
          echo
          echo "=== ALL mutants for reference ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT execution_status, mutator, line_number, column_number FROM mutant ORDER BY line_number, column_number;"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compose-suppression-report
          path: |
            mutation-report.txt
            compose-suppression*.sqlite
            compose-suppression*.txt
          retention-days: 30
          if-no-files-found: warn
