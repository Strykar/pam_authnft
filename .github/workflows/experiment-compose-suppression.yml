name: experiment-compose-suppression
# Throwaway workflow for the mull+ASan stack-instrumentation
# suppression investigation. Runs on the
# experiment/mull-asan-compose-suppression branch only; deleted
# with the branch after the investigation's writeup commits to
# main (docs/MUTATION_ASAN_INVESTIGATION_2.md).
#
# Per-run variables (pass-plugin CLI order, heap vs stack,
# sanitiser flags, optimisation level, mutator filter) change
# between commits on the experiment branch rather than via
# workflow_dispatch inputs — keeps each run a one-line commit
# diff and an auditable git log.
#
# Build is inline rather than Makefile-target-based because the
# stub binary is throwaway; adding a target would land on main
# via the wrong path.
on:
  push:
    branches:
      - experiment/mull-asan-compose-suppression
    paths:
      - 'experiment/stub_compose_suppression.c'
      - 'experiment/test_compose_suppression.c'
      - '.github/workflows/experiment-compose-suppression.yml'
      - 'mull.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MULL_LLVM_MAJOR: '19'

jobs:
  experiment-compose-suppression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install build dependencies
        run: |
          # Run 4a reverts to the bare stub; the production-header
          # cluster from run 3 is not needed. Only the mull repo
          # install dependencies remain.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl gnupg ca-certificates

      - name: Install mull and matching clang
        run: |
          curl -1sLf "https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh" \
              -o /tmp/mull-repo.sh
          test "$(wc -l < /tmp/mull-repo.sh)" -lt 1000
          sudo -E bash /tmp/mull-repo.sh
          sudo apt-get install -y \
              "mull-${MULL_LLVM_MAJOR}" "clang-${MULL_LLVM_MAJOR}"
          "mull-runner-${MULL_LLVM_MAJOR}" --version

      - name: Build stub_compose_suppression.mull (run 5a-stkprot — first HARDENING flag)
        run: |
          # Run 5a-stkprot: first HARDENING flag in the additive
          # bisection. 5b' eliminated UBSan-in-compose as the H0'
          # carrier (status=1 with UBSan diagnostic followed by
          # ASan block + ABORTING; neither suppressed in the bare
          # stub). The bisection advances to HARDENING flags one
          # at a time. Prior-probability ordering: stkprot first
          # (reshapes stack frame around arrays — most direct
          # mechanism for interacting with ASan stack
          # instrumentation), then autovarinit, then cfprot, then
          # stkclash.
          #
          # Single-flag, single-variable diff from 5b':
          # -fstack-protector-strong added to CFLAGS at compile
          # AND link (parity with production's same-flags-at-both
          # pattern; link-side is technically a no-op but the
          # bisection reproduces production as production
          # produces it, not as a minimal counterfactual).
          # Nothing else changes; UBSAN_OPTIONS stays at
          # halt_on_error=0 so the "both fire" outcome shows both
          # diagnostics cleanly.
          #
          # Build-flag audit (confirm no other HARDENING flags
          # leak in, same shape as the audits before 4a and 5b'):
          #   - No -fstack-clash-protection anywhere in workflow.
          #   - No -fcf-protection anywhere in workflow.
          #   - No -ftrivial-auto-var-init anywhere in workflow.
          #   - No -fno-strict-overflow anywhere in workflow.
          #   - No -fstack-protector-strong already present
          #     (would indicate inheritance from elsewhere).
          # Build is per-file inline clang, not Makefile-driven,
          # so no CFLAGS_BASE inheritance. The flag added here is
          # the only HARDENING variable in play.
          #
          # H0' framing broadened: production (run 3) shows BOTH
          # sanitisers suppressed on the line-55 mutant
          # (status=2, empty stderr), not just ASan. Success
          # condition for 5a-split runs is "both stop firing",
          # not "ASan stops firing". A flag that suppresses only
          # ASan is a partial contributor, not a full H0'
          # reproduction.
          #
          # Verdict for line-51 cxx_ge_to_gt (filter SQLite by
          # line_number = 51 AND mutator = 'cxx_ge_to_gt'). Five
          # interpretive cells, pre-stated as (status_code,
          # stderr_content) pairs:
          #
          #   CELL 1 (2, stderr empty):
          #     Full H0' reproduction. -fstack-protector-strong
          #     is SUFFICIENT to suppress both sanitisers in the
          #     bare-stub compose at -O0. Sufficiency does not
          #     imply uniqueness; subsequent HARDENING flags
          #     might also be sufficient on their own, or stkprot
          #     may be one of several contributing variables in
          #     production. Bisection has reached a reportable
          #     finding even if it doesn't fully characterise
          #     production. Pause and write up.
          #
          #   CELL 2 (1, UBSan diagnostic only, no ASan block,
          #           no "ABORTING"):
          #     Partial reproduction. UBSan still fires, ASan
          #     suppressed. -fstack-protector-strong is a
          #     NECESSARY-BUT-NOT-SUFFICIENT contributor to H0'
          #     (suppresses ASan stack-instrumentation
          #     specifically). Production has additional
          #     contributor(s) that also suppress UBSan.
          #     Bisection model shifts from "find the carrier"
          #     to "find the contributing set": next run is
          #     5a-stkprot + 5a-autovarinit cumulatively (testing
          #     "does this flag, ADDED to stkprot, advance H0'
          #     reproduction further", not "is this flag a
          #     contributor in isolation"). Sufficiency-vs-
          #     necessity of individual flags within the
          #     contributing set may need a separate post-
          #     cumulative-bisection phase to characterise.
          #
          #   CELL 3 (1, ASan diagnostic block + "ABORTING", no
          #           UBSan diagnostic):
          #     Surprising partial. ASan still fires but UBSan
          #     suppressed by stkprot. 5b' established UBSan
          #     fires reliably in the bare stub WITHOUT stkprot;
          #     if it stops firing with stkprot added, that's an
          #     interaction between stkprot's stack-layout
          #     reordering and UBSan's bounds-check
          #     instrumentation, not an ASan-suppression story.
          #     STRONGER PAUSE than cells 2 or 4: continuing the
          #     H0' bisection without characterising this
          #     interaction would mean carrying an
          #     uncharacterised variable through subsequent runs,
          #     compounding attribution uncertainty downstream.
          #     The bisection model's assumption (variables
          #     compose additively with sanitiser instrumentation)
          #     is wrong for this flag combination; characterise
          #     before continuing.
          #
          #   CELL 4 (1, UBSan diagnostic then ASan block +
          #           "ABORTING", two cleanly separated blocks
          #           like 5b'):
          #     No effect on either sanitiser. -fstack-protector-
          #     strong is NOT a contributor to H0' in the bare
          #     stub at -O0 with this test surface. Eliminate;
          #     advance to 5a-autovarinit as the next single-
          #     variable additive run (strict sequencing).
          #
          #   CELL 5 (any, INTERLEAVED diagnostics):
          #     Attribution not safe; treat as needs-follow-up
          #     rather than guessing first-fired.
          #
          #   (4, _), (5, _), (3, _):
          #     Attribute from stderr column, not from status
          #     name.
          #
          # Line-47 invariance: cxx_ge_to_gt AND cxx_ge_to_lt
          # both expected to remain status=2 with empty stderr
          # (parity, same as 4a, 5b, 5b'). Post-run check both
          # mutators; a divergence between the two at line-47,
          # or a flip from the baseline, is a surprising result
          # the verdict mapping does not enumerate.
          #
          # Load-bearing assumption (worth confirming pre-
          # writeup, not blocking 5a-stkprot): run 3's status=2
          # on the line-55 mutant reflects suppression of both
          # sanitisers on the OOB write, not the test surface
          # failing to exercise the OOB path. The most plausible
          # reading of run 3's evidence given test_util_validators
          # .c's test structure, but if the writeup turns up
          # contradicting evidence, the pre-planned verification
          # is: modify test_util_validators.c to deliberately
          # plant a buffer-boundary input that exercises the
          # core[in_len] = '\0' write under production CFLAGS,
          # then observe whether either sanitiser fires. If
          # neither fires, suppression is real; if one or both
          # fire, the assumption is wrong and the production
          # "suppression" is actually "test doesn't reach the
          # bug".
          CLANG="clang-${MULL_LLVM_MAJOR}"
          PLUGIN="/usr/lib/mull-ir-frontend-${MULL_LLVM_MAJOR}"
          CFLAGS="-fpass-plugin=$PLUGIN -fsanitize=address,undefined -fno-omit-frame-pointer -g -grecord-command-line -O0 -fstack-protector-strong"
          $CLANG $CFLAGS -c experiment/stub_compose_suppression.c -o /tmp/stub_compose.mull.o
          $CLANG $CFLAGS -c experiment/test_compose_suppression.c -o /tmp/test_compose.mull.o
          $CLANG -fsanitize=address,undefined -fno-omit-frame-pointer -fstack-protector-strong \
              /tmp/stub_compose.mull.o /tmp/test_compose.mull.o \
              -o stub_compose_suppression.mull

      - name: Run mull-runner
        id: mull
        env:
          ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:print_summary=1"
          UBSAN_OPTIONS: "halt_on_error=0:print_stacktrace=1:print_summary=1"
        run: |
          set +e
          "mull-runner-${MULL_LLVM_MAJOR}" \
              --ide-reporter-show-killed \
              --minimum-timeout 5000 \
              --reporters IDE --reporters SQLite \
              --report-dir . \
              --report-name compose-suppression \
              ./stub_compose_suppression.mull > mutation-report.txt 2>&1
          ec=$?
          set -e
          echo "exit=$ec" >> "$GITHUB_OUTPUT"
          {
            echo "## compose-suppression mutation report"
            echo
            echo '```'
            tail -200 mutation-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Query SQLite — survivors, crashes, mutator distribution
        if: always()
        run: |
          if [ ! -f compose-suppression.sqlite ]; then
            echo "::error::compose-suppression.sqlite missing"
            exit 1
          fi
          echo "=== status distribution ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT execution_status, COUNT(*) FROM mutant GROUP BY execution_status ORDER BY execution_status;"
          echo
          echo "=== survivors (status=2): mutator, line, column ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT mutator, line_number, column_number, mutation_replacement FROM mutant WHERE execution_status = 2;"
          echo
          echo "=== crashed (status=4): mutator, line, column ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT mutator, line_number, column_number, mutation_replacement FROM mutant WHERE execution_status = 4;"
          echo
          echo "=== ALL mutants for reference ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT execution_status, mutator, line_number, column_number FROM mutant ORDER BY line_number, column_number;"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compose-suppression-report
          path: |
            mutation-report.txt
            compose-suppression*.sqlite
            compose-suppression*.txt
          retention-days: 30
          if-no-files-found: warn
