name: experiment-compose-suppression
# Throwaway workflow for the mull+ASan stack-instrumentation
# suppression investigation. Runs on the
# experiment/mull-asan-compose-suppression branch only; deleted
# with the branch after the investigation's writeup commits to
# main (docs/MUTATION_ASAN_INVESTIGATION_2.md).
#
# Per-run variables (pass-plugin CLI order, heap vs stack,
# sanitiser flags, optimisation level, mutator filter) change
# between commits on the experiment branch rather than via
# workflow_dispatch inputs — keeps each run a one-line commit
# diff and an auditable git log.
#
# Build is inline rather than Makefile-target-based because the
# stub binary is throwaway; adding a target would land on main
# via the wrong path.
on:
  push:
    branches:
      - experiment/mull-asan-compose-suppression
    paths:
      - 'experiment/stub_compose_suppression.c'
      - 'experiment/test_compose_suppression.c'
      - '.github/workflows/experiment-compose-suppression.yml'
      - 'mull.yml'
      - 'Makefile'
  workflow_dispatch:

permissions:
  contents: read

env:
  MULL_LLVM_MAJOR: '19'

jobs:
  experiment-compose-suppression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install build dependencies
        run: |
          # Run 5c builds via the production Makefile target
          # test_util_validators.mull, which transitively
          # includes authnft.h's PAM/nftables/seccomp/systemd/
          # cap/audit headers. Restore the production-deps
          # cluster removed in 4a (matches util-validator-
          # mutation.yml's install step).
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libnftables-dev libseccomp-dev libsystemd-dev \
            libpam0g-dev libcap-dev libaudit-dev \
            curl gnupg ca-certificates

      - name: Install mull and matching clang
        run: |
          curl -1sLf "https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh" \
              -o /tmp/mull-repo.sh
          test "$(wc -l < /tmp/mull-repo.sh)" -lt 1000
          sudo -E bash /tmp/mull-repo.sh
          sudo apt-get install -y \
              "mull-${MULL_LLVM_MAJOR}" "clang-${MULL_LLVM_MAJOR}"
          "mull-runner-${MULL_LLVM_MAJOR}" --version

      - name: Verify Makefile fix propagates MULL_EXTRA_CFLAGS to source-TU build
        env:
          MULL_EXTRA_CFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer"
        run: |
          # Checkpoint review: confirm the Makefile pattern-rule
          # fix (line 321-326, adding $(MULL_EXTRA_CFLAGS) after
          # -fpass-plugin) actually changes the source-TU build
          # before mull-runner fires. Same audit-discipline shape
          # as the build-flag audits before prior runs, applied
          # to the load-bearing structural change this run rests
          # on. Failing this check would mean the fix is in the
          # commit but isn't doing what its commit message
          # claims, which would invalidate 5c's verdict before
          # the run produces it.
          make -n test_util_validators.mull > /tmp/argv.txt 2>&1
          # make -n emits each clang invocation across multiple
          # lines via backslash continuation. The -c source path
          # (src/util_validators.c) lands on the LAST continuation
          # line; -fsanitize=address is on the FIRST. Single-line
          # grep won't see them together. Use -B context to scope
          # the search to the lines preceding the -c source path,
          # which captures the whole invocation block.
          if ! grep -B5 'src/util_validators\.c' /tmp/argv.txt | grep -q 'fsanitize=address'; then
              echo "::error::Makefile fix did not propagate MULL_EXTRA_CFLAGS to src/util_validators.c build"
              cat /tmp/argv.txt
              exit 1
          fi
          echo "Verified: src/util_validators.c build invocation now contains -fsanitize=address,undefined"
          grep -B5 'src/util_validators\.c' /tmp/argv.txt

      - name: Build test_util_validators.mull (run 5c — production-Makefile-fix verification)
        env:
          MULL_EXTRA_CFLAGS: "-fsanitize=address,undefined -fno-omit-frame-pointer"
        run: |
          # Run 5c: direct verification of the H0' candidate
          # surfaced by option (C)'s mechanical-argv-diff at
          # 4×cell-4 (post 5a-stkclash, run 26096477272,
          # commit 5164b05).
          #
          # The argv-diff between production and the bare stub
          # surfaced three asymmetries the original eyeball
          # enumeration missed. Asymmetry 1 is load-bearing:
          # the Makefile's source-TU mull-object rule
          # ($(OBJ_DIR)/%.mull.o: src/%.c, line 321-326) does
          # NOT reference $(MULL_EXTRA_CFLAGS). The test-TU
          # rule ($(OBJ_DIR)/test_util_validators.mull.o,
          # line 358-362) does. So in production:
          #   - util_validators.mull.o (source TU containing
          #     the line-55 mutation target) is compiled with
          #     HARDENING + pkg-config cflags + -O0, but with
          #     NO sanitiser instrumentation.
          #   - test_util_validators.mull.o (test TU) is
          #     compiled with sanitisers but no HARDENING.
          #   - The link step pulls in the sanitiser runtimes
          #     but does NOT retroactively instrument the
          #     source TU's object code.
          # Result: the OOB write at core[in_len] = '\0' in
          # util_normalize_ip (src/util_validators.c:55-56)
          # happens in unsanitised code. No shadow-byte check,
          # no bounds check. ASan and UBSan are both linked
          # but have no per-access hooks to service. The
          # "compose suppression" observed in run 3 is not a
          # sanitiser-instrumentation interaction; it is a
          # build-recipe asymmetry where the source TU was
          # never instrumented.
          #
          # 5c applies the Makefile fix (one-line addition of
          # $(MULL_EXTRA_CFLAGS) to the source-TU rule,
          # mirroring the test-TU rule's pattern) and
          # verifies whether the line-55 mutant gets killed
          # when the source TU is actually instrumented.
          #
          # Workflow shape reverts from bare-stub (4a, 5b,
          # 5b', 5a-*) back to run-3-style production-Makefile
          # build, with the fix applied. The preceding step
          # ("Verify Makefile fix propagates MULL_EXTRA_CFLAGS
          # to source-TU build") is a checkpoint that runs
          # make -n and confirms the fix is doing what its
          # commit claims, before the actual mull build fires.
          #
          # Verdict mapping for line-55 cxx_ge_to_gt in
          # src/util_validators.c. NOTE: line-55 in
          # util_validators.c is the ORIGINAL mutation target
          # from run 3 / PR #51's audit, NOT the stub's
          # analog at line 51 in experiment/stub_compose_
          # suppression.c. The stub was a faithful structural
          # mirror designed to reproduce the production
          # behaviour in isolation; run 5c returns to the
          # production binary itself with the Makefile fix
          # applied, so the SQLite filter shifts from
          # line_number = 51 to line_number = 55 AND
          # filename LIKE '%util_validators.c%'.
          #
          # Pre-stated (status_code, stderr_content) pairs:
          #
          #   (1, stderr contains AddressSanitizer
          #       stack-buffer-overflow OR UndefinedBehavior
          #       Sanitizer bounds-check diagnostic for
          #       line 55):
          #     H0' CONFIRMED. The production "suppression"
          #     was sanitisers-not-applied to the source TU.
          #     The bisection's original premise (compose-
          #     suppression as a sanitiser-instrumentation
          #     interaction) was wrong; the actual finding
          #     is a Makefile pattern-rule omission. The fix
          #     in this commit is the structural remediation.
          #     Pause and write up. Three follow-up work-
          #     items surface but are OUT OF SCOPE for the
          #     investigation's writeup:
          #       (1) util-validator-mutation workflow score
          #           rebaseline (97.1% reflects mutations
          #           whose effects produce return-value-
          #           observable differences only; sanitiser-
          #           detected mutations were not contributing
          #           to the score).
          #       (2) docs/MUTATION_ASAN_EXPERIMENT.md
          #           commit 8968cf4's Finding 4 needs
          #           significant revision; the "compose
          #           suppresses ASan stack-instrumentation"
          #           framing is wrong.
          #       (3) PR #51's premise revisit: the convention
          #           extension's coverage-bound rested on the
          #           compose-suppression finding; the actual
          #           bound is different.
          #     None resolved by this run; named so the
          #     writeup can surface them as follow-ups.
          #
          #   (2, stderr empty):
          #     H0' not fully explained by sanitisers-not-
          #     applied. Something else is also contributing.
          #     Four sub-possibilities pre-stated rather than
          #     reasoned ad hoc:
          #       (a) HARDENING-en-bloc interaction with
          #           now-applied sanitisers. The individual-
          #           phase bisection eliminated each flag in
          #           isolation against the bare stub; the
          #           en-bloc combination on the source TU
          #           with sanitisers might interact
          #           differently. Next run: 5d-hard-en-bloc.
          #       (b) Fourth structural asymmetry the argv-
          #           diff didn't surface. Possible candidates:
          #           link-order, build-output-path conventions,
          #           MULL_RUNNER env interactions. Re-run the
          #           differential at a different level (linked
          #           binary's symbol table, strace of actual
          #           build).
          #       (c) pkg-config-inherited flags affecting
          #           sanitiser instrumentation. Some
          #           -D_FOO_SOURCE macros change libc-header
          #           inlines (memcpy intrinsics, strchr
          #           inlines) in ways that affect what gets
          #           instrumented. The pkg-config cflags for
          #           libnftables/libseccomp/libsystemd/pam/
          #           libcap/audit add -D macros not present
          #           in the bare stub.
          #       (d) Test-TU and source-TU different flag
          #           sets even when both sanitised: test-TU
          #           has just sanitisers + debug + include;
          #           source-TU (post-fix) has sanitisers +
          #           HARDENING + pkg-config-cflags. The
          #           bare-stub bisection had identical flags
          #           on both TUs; this asymmetry is new in
          #           5c.
          #
          #   (other status / stderr shapes):
          #     Attribute from stderr column. The line-55
          #     mutant's previous behaviour (run 3) was
          #     status=2 empty stderr; any other outcome is a
          #     state change to interpret.
          #
          # Post-run discipline (carried forward from prior
          # runs): cite the actual workflow run ID and SQLite
          # filename. Filter SQLite by line_number = 55 AND
          # filename matches util_validators.c (the production
          # binary's mull-runner produces a larger mutant
          # population than the bare-stub workflow; expect
          # many survivors at other lines from prior production
          # state — the line-55 row is the one this run is
          # designed to verify).
          make test_util_validators.mull

      - name: Run mull-runner
        id: mull
        env:
          ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:print_summary=1"
          UBSAN_OPTIONS: "halt_on_error=0:print_stacktrace=1:print_summary=1"
        run: |
          set +e
          "mull-runner-${MULL_LLVM_MAJOR}" \
              --ide-reporter-show-killed \
              --minimum-timeout 5000 \
              --reporters IDE --reporters SQLite \
              --report-dir . \
              --report-name compose-suppression \
              ./test_util_validators.mull > mutation-report.txt 2>&1
          ec=$?
          set -e
          echo "exit=$ec" >> "$GITHUB_OUTPUT"
          {
            echo "## compose-suppression mutation report"
            echo
            echo '```'
            tail -200 mutation-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Query SQLite — survivors, crashes, mutator distribution
        if: always()
        run: |
          if [ ! -f compose-suppression.sqlite ]; then
            echo "::error::compose-suppression.sqlite missing"
            exit 1
          fi
          echo "=== status distribution ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT execution_status, COUNT(*) FROM mutant GROUP BY execution_status ORDER BY execution_status;"
          echo
          echo "=== survivors (status=2): mutator, line, column ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT mutator, line_number, column_number, mutation_replacement FROM mutant WHERE execution_status = 2;"
          echo
          echo "=== crashed (status=4): mutator, line, column ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT mutator, line_number, column_number, mutation_replacement FROM mutant WHERE execution_status = 4;"
          echo
          echo "=== ALL mutants for reference ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT execution_status, mutator, line_number, column_number FROM mutant ORDER BY line_number, column_number;"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compose-suppression-report
          path: |
            mutation-report.txt
            compose-suppression*.sqlite
            compose-suppression*.txt
          retention-days: 30
          if-no-files-found: warn
