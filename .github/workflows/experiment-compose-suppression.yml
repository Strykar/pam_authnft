name: experiment-compose-suppression
# Throwaway workflow for the mull+ASan stack-instrumentation
# suppression investigation. Runs on the
# experiment/mull-asan-compose-suppression branch only; deleted
# with the branch after the investigation's writeup commits to
# main (docs/MUTATION_ASAN_INVESTIGATION_2.md).
#
# Per-run variables (pass-plugin CLI order, heap vs stack,
# sanitiser flags, optimisation level, mutator filter) change
# between commits on the experiment branch rather than via
# workflow_dispatch inputs — keeps each run a one-line commit
# diff and an auditable git log.
#
# Build is inline rather than Makefile-target-based because the
# stub binary is throwaway; adding a target would land on main
# via the wrong path.
on:
  push:
    branches:
      - experiment/mull-asan-compose-suppression
    paths:
      - 'experiment/stub_compose_suppression.c'
      - 'experiment/test_compose_suppression.c'
      - '.github/workflows/experiment-compose-suppression.yml'
      - 'mull.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MULL_LLVM_MAJOR: '19'

jobs:
  experiment-compose-suppression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install build dependencies
        run: |
          # Run 4a reverts to the bare stub; the production-header
          # cluster from run 3 is not needed. Only the mull repo
          # install dependencies remain.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl gnupg ca-certificates

      - name: Install mull and matching clang
        run: |
          curl -1sLf "https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh" \
              -o /tmp/mull-repo.sh
          test "$(wc -l < /tmp/mull-repo.sh)" -lt 1000
          sudo -E bash /tmp/mull-repo.sh
          sudo apt-get install -y \
              "mull-${MULL_LLVM_MAJOR}" "clang-${MULL_LLVM_MAJOR}"
          "mull-runner-${MULL_LLVM_MAJOR}" --version

      - name: Build stub_compose_suppression.mull (run 5a-cfprot — third HARDENING flag)
        run: |
          # Run 5a-cfprot: third HARDENING flag in the additive
          # bisection. Two cell-4 eliminations banked:
          #   5a-stkprot     (run 26089833756, commit 26ec3b8)
          #   5a-autovarinit (run 26093491304, commit 71dd659)
          # Both fired both sanitisers cleanly, stderr byte-
          # identical at 4784 bytes across 5b', 5a-stkprot,
          # 5a-autovarinit. Per-run stderr byte-equality is
          # incidental confirmation that the bisection variable
          # is being changed cleanly across runs and previous
          # state isn't bleeding through via build cache or
          # partial reverts — a coherence signal worth recording
          # in the writeup for future bisection investigators.
          #
          # Single-flag, single-variable diff from 5b' (NOT from
          # 5a-autovarinit — strict sequencing means each cell-4
          # eliminated flag drops out of the running build).
          # -fcf-protection added at compile AND link. Mechanism:
          # clang inserts CET endbr/landing-pad instructions for
          # control-flow integrity, primarily affecting function
          # entry/exit codegen. Lower direct interaction with
          # stack data than stkprot or autovarinit; the
          # plausible mechanism for ASan suppression is that
          # endbr insertion shifts function-entry IR offsets in
          # a way that mull's pass plugin sees different IR at
          # the point it emits mutation hooks. Lower-prior than
          # the two eliminated flags but not zero.
          #
          # Interpretation note: a cell-1 outcome here would
          # produce a qualitatively different finding than
          # cell-1 on stkprot or autovarinit would have. The
          # mechanism would be about pass-plugin sensitivity to
          # control-flow instrumentation, not about ASan
          # stack-instrumentation per se, and the H0' framing
          # would need to shift again to accommodate. Worth
          # being mentally prepared for this; not a design
          # change.
          #
          # UBSAN_OPTIONS stays at halt_on_error=0.
          #
          # Build-flag audit (same shape as previous pre-push
          # audits):
          #   - No -ftrivial-auto-var-init anywhere in workflow
          #     (confirmed: 5a-autovarinit's flag fully removed).
          #   - No -fstack-protector-strong anywhere in workflow.
          #   - No -fstack-clash-protection anywhere in workflow.
          #   - No -fno-strict-overflow anywhere in workflow.
          #   - No -fcf-protection already present (would
          #     indicate inheritance from elsewhere).
          # Per-file inline clang build, no CFLAGS_BASE
          # inheritance. The flag added here is the only
          # HARDENING variable in play.
          #
          # H0' framing unchanged: production shows BOTH
          # sanitisers suppressed; success condition is "both
          # stop firing", not "ASan stops firing."
          #
          # Verdict for line-51 cxx_ge_to_gt. Five interpretive
          # cells, structurally identical to prior runs with
          # the flag name substituted:
          #
          #   CELL 1 (2, stderr empty):
          #     Full H0' reproduction. -fcf-protection is
          #     SUFFICIENT to suppress both sanitisers in the
          #     bare-stub compose at -O0. Pause and write up.
          #     Note interpretation shift: a control-flow-
          #     instrumentation mechanism for the suppression
          #     is qualitatively different from a stack-data
          #     mechanism; the H0' framing would need to
          #     accommodate "pass-plugin sensitivity to
          #     control-flow codegen" as the carrier rather
          #     than "ASan stack-instrumentation suppression"
          #     as a generic mechanism.
          #
          #   CELL 2 (1, UBSan only, no ASan):
          #     Partial. cfprot suppresses ASan specifically.
          #     Cumulative-additive next: 5a-cfprot +
          #     5a-stkclash. Cumulative set starts with cfprot
          #     alone; previously-eliminated flags (stkprot,
          #     autovarinit) stay eliminated and do NOT re-enter
          #     the build. The next run's verdict mapping
          #     reframes to "does stkclash, added to cfprot,
          #     advance H0' reproduction further."
          #
          #   CELL 3 (1, ASan only, no UBSan):
          #     Surprising. cfprot×UBSan interaction; stronger
          #     pause. Bisection model's additivity assumption
          #     is wrong for this flag combination.
          #
          #   CELL 4 (1, UBSan then ASan + ABORTING, two
          #           cleanly separated blocks like prior runs):
          #     No effect on either sanitiser. cfprot is NOT a
          #     contributor to H0' in the bare stub at -O0 with
          #     this test surface. Eliminate; advance to
          #     5a-stkclash as the final single-variable
          #     additive run.
          #
          #   CELL 5 (any, INTERLEAVED diagnostics):
          #     Attribution not safe; needs follow-up.
          #
          #   (4, _), (5, _), (3, _):
          #     Attribute from stderr column.
          #
          # Three-option branching for the 4×cell-4 scenario,
          # REFINED with sequencing now that two cell-4 are
          # banked: the three options are NOT mutually exclusive.
          # (C) is a prerequisite for choosing between (A) and
          # (B), not a parallel alternative.
          #
          #   (C) FIRST → re-derive the 4a-vs-production
          #       differential by reading the production
          #       Makefile's effective CFLAGS for the validator
          #       binary fresh, line by line, against the bare-
          #       stub workflow's CFLAGS, looking for anything
          #       not on the original enumeration (HARDENING,
          #       _FORTIFY_SOURCE via -D, UBSan eliminated, TU
          #       expansion, pkg-config-inherited cflags, test
          #       surface). The initial enumeration may be
          #       incomplete; the contributor may be a variable
          #       not yet surfaced.
          #
          #   THEN choose between (A) and (B):
          #       (A) HARDENING-en-bloc cumulative run. Tests
          #           flag interaction (two or more HARDENING
          #           flags only suppress when together).
          #       (B) Advance to other variables from the fresh
          #           differential (TU expansion, pkg-config,
          #           build-path, or whatever (C) surfaces).
          #
          # Pre-committing the (C) → (A or B) sequencing now
          # protects against the post-4×cell-4 decision being
          # reasoned in real-time on the strength of priors.
          # If 5a-stkclash also lands cell 4, the next action
          # is mechanical: re-derive the differential, then
          # decide.
          #
          # Continuation rule regardless of 5a-cfprot outcome:
          # 5a-stkclash fires next. Cell-4 advances to stkclash
          # as the strict-sequencing continuation. Cell-1, -2,
          # or -3 changes the framing but does not skip
          # stkclash — the individual-flag phase completes
          # before any post-individual decision (en-bloc or
          # advance-elsewhere). This is the discipline default;
          # only an explicit decision to abort the individual
          # phase changes it.
          #
          # Line-47 invariance: cxx_ge_to_gt AND cxx_ge_to_lt
          # both expected to remain status=2 with empty stderr
          # (parity across 4a, 5b, 5b', 5a-stkprot,
          # 5a-autovarinit). Post-run check both mutators.
          #
          # stderr_len drift check: expected 4784 if cell-4
          # lands (byte-equality with prior cell-4 runs). A
          # drift of more than a few bytes despite cell-4
          # mapping is a finding worth understanding before
          # advancing — would suggest cfprot is changing
          # something in the diagnostic output even though
          # both sanitisers still fire.
          #
          # Load-bearing assumption (unchanged): run 3's
          # status=2 reflects suppression of both sanitisers on
          # the OOB write, not the test surface failing to
          # exercise the OOB path. Pre-planned verification
          # documented in prior commits.
          CLANG="clang-${MULL_LLVM_MAJOR}"
          PLUGIN="/usr/lib/mull-ir-frontend-${MULL_LLVM_MAJOR}"
          CFLAGS="-fpass-plugin=$PLUGIN -fsanitize=address,undefined -fno-omit-frame-pointer -g -grecord-command-line -O0 -fcf-protection"
          $CLANG $CFLAGS -c experiment/stub_compose_suppression.c -o /tmp/stub_compose.mull.o
          $CLANG $CFLAGS -c experiment/test_compose_suppression.c -o /tmp/test_compose.mull.o
          $CLANG -fsanitize=address,undefined -fno-omit-frame-pointer -fcf-protection \
              /tmp/stub_compose.mull.o /tmp/test_compose.mull.o \
              -o stub_compose_suppression.mull

      - name: Run mull-runner
        id: mull
        env:
          ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:print_summary=1"
          UBSAN_OPTIONS: "halt_on_error=0:print_stacktrace=1:print_summary=1"
        run: |
          set +e
          "mull-runner-${MULL_LLVM_MAJOR}" \
              --ide-reporter-show-killed \
              --minimum-timeout 5000 \
              --reporters IDE --reporters SQLite \
              --report-dir . \
              --report-name compose-suppression \
              ./stub_compose_suppression.mull > mutation-report.txt 2>&1
          ec=$?
          set -e
          echo "exit=$ec" >> "$GITHUB_OUTPUT"
          {
            echo "## compose-suppression mutation report"
            echo
            echo '```'
            tail -200 mutation-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Query SQLite — survivors, crashes, mutator distribution
        if: always()
        run: |
          if [ ! -f compose-suppression.sqlite ]; then
            echo "::error::compose-suppression.sqlite missing"
            exit 1
          fi
          echo "=== status distribution ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT execution_status, COUNT(*) FROM mutant GROUP BY execution_status ORDER BY execution_status;"
          echo
          echo "=== survivors (status=2): mutator, line, column ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT mutator, line_number, column_number, mutation_replacement FROM mutant WHERE execution_status = 2;"
          echo
          echo "=== crashed (status=4): mutator, line, column ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT mutator, line_number, column_number, mutation_replacement FROM mutant WHERE execution_status = 4;"
          echo
          echo "=== ALL mutants for reference ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT execution_status, mutator, line_number, column_number FROM mutant ORDER BY line_number, column_number;"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compose-suppression-report
          path: |
            mutation-report.txt
            compose-suppression*.sqlite
            compose-suppression*.txt
          retention-days: 30
          if-no-files-found: warn
