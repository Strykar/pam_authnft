name: experiment-compose-suppression
# Throwaway workflow for the mull+ASan stack-instrumentation
# suppression investigation. Runs on the
# experiment/mull-asan-compose-suppression branch only; deleted
# with the branch after the investigation's writeup commits to
# main (docs/MUTATION_ASAN_INVESTIGATION_2.md).
#
# Per-run variables (pass-plugin CLI order, heap vs stack,
# sanitiser flags, optimisation level, mutator filter) change
# between commits on the experiment branch rather than via
# workflow_dispatch inputs — keeps each run a one-line commit
# diff and an auditable git log.
#
# Build is inline rather than Makefile-target-based because the
# stub binary is throwaway; adding a target would land on main
# via the wrong path.
on:
  push:
    branches:
      - experiment/mull-asan-compose-suppression
    paths:
      - 'experiment/stub_compose_suppression.c'
      - 'experiment/test_compose_suppression.c'
      - '.github/workflows/experiment-compose-suppression.yml'
      - 'mull.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MULL_LLVM_MAJOR: '19'

jobs:
  experiment-compose-suppression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install build dependencies
        run: |
          # Run 4a reverts to the bare stub; the production-header
          # cluster from run 3 is not needed. Only the mull repo
          # install dependencies remain.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl gnupg ca-certificates

      - name: Install mull and matching clang
        run: |
          curl -1sLf "https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh" \
              -o /tmp/mull-repo.sh
          test "$(wc -l < /tmp/mull-repo.sh)" -lt 1000
          sudo -E bash /tmp/mull-repo.sh
          sudo apt-get install -y \
              "mull-${MULL_LLVM_MAJOR}" "clang-${MULL_LLVM_MAJOR}"
          "mull-runner-${MULL_LLVM_MAJOR}" --version

      - name: Build stub_compose_suppression.mull (run 5a-stkclash — fourth HARDENING flag, individual phase complete)
        run: |
          # Run 5a-stkclash: fourth and final individual
          # HARDENING flag. Three cell-4 eliminations banked:
          #   5a-stkprot     (run 26089833756, commit 26ec3b8)
          #   5a-autovarinit (run 26093491304, commit 71dd659)
          #   5a-cfprot      (run 26096117471, commit a5e5b77)
          # All produced byte-identical line-51 stderr at 4784
          # bytes (two cleanly separated diagnostic blocks: UBSan
          # logged, ASan tripped, ABORTING). The 4×cell-4 case
          # materialises if this run also lands cell-4. Three-
          # option branching with (C) → (A or B) sequencing,
          # pre-committed in 5a-cfprot, applies.
          #
          # Single-flag, single-variable diff from 5b' (NOT from
          # 5a-cfprot — strict sequencing). -fstack-clash-
          # protection added at compile AND link. Mechanism:
          # clang emits probe instructions for stack allocations
          # that might exceed a guard page (4KiB), interleaving
          # writes with allocation growth so a stack-clash
          # attack can't skip past the guard. Our core[64] is
          # 64 bytes, well under the threshold that would
          # trigger probing in this function. The mechanism for
          # this flag affecting ASan stack-instrumentation in
          # our test surface is the thinnest of the four HARDENING
          # flags; cell-4 is the highest-prior outcome.
          #
          # UBSAN_OPTIONS stays at halt_on_error=0.
          #
          # Build-flag audit (same shape as previous pre-push
          # audits):
          #   - No -fcf-protection anywhere in workflow
          #     (confirmed: 5a-cfprot's flag fully removed).
          #   - No -fstack-protector-strong anywhere in workflow.
          #   - No -ftrivial-auto-var-init anywhere in workflow.
          #   - No -fno-strict-overflow anywhere in workflow.
          #   - No -fstack-clash-protection already present
          #     (would indicate inheritance from elsewhere).
          # Per-file inline clang build, no CFLAGS_BASE
          # inheritance.
          #
          # Verdict for line-51 cxx_ge_to_gt. Five interpretive
          # cells, structurally identical to prior HARDENING
          # runs with the flag name substituted:
          #
          #   CELL 1 (2, stderr empty):
          #     Full H0' reproduction. -fstack-clash-protection
          #     SUFFICIENT to suppress both sanitisers. Pause
          #     and write up. Surprising given the mechanism's
          #     thinness; interpret carefully — the finding
          #     would be about probe-instruction emission
          #     interacting with mull's pass-plugin IR view,
          #     not about stack-clash protection's intended
          #     effect.
          #
          #   CELL 2 (1, UBSan only, no ASan):
          #     Partial. stkclash suppresses ASan specifically.
          #     Cumulative-additive: stkclash is the only flag
          #     in the contributing set so far; subsequent
          #     cumulative runs would re-introduce previously-
          #     eliminated flags ONE AT A TIME on top of
          #     stkclash to characterise the contributing set.
          #     Eliminated flags re-enter the build only in
          #     cumulative-additive mode, never in individual
          #     mode.
          #
          #   CELL 3 (1, ASan only, no UBSan):
          #     Surprising. stkclash×UBSan interaction;
          #     stronger pause. Bisection model's additivity
          #     assumption is wrong for this flag combination.
          #
          #   CELL 4 (1, UBSan then ASan + ABORTING, two
          #           cleanly separated blocks):
          #     No effect on either sanitiser. stkclash is NOT
          #     a contributor in isolation. 4×cell-4 case
          #     materialises: no single HARDENING flag is the
          #     carrier in isolation. Advance to the (C) → (A
          #     or B) sequencing pre-committed below.
          #
          #   CELL 5 (any, INTERLEAVED diagnostics):
          #     Attribution not safe; needs follow-up.
          #
          # (C) → (A or B) sequencing for the 4×cell-4 case,
          # REFINED with mechanical-audit discipline:
          #
          #   (C) is NOT eyeball-reading-the-Makefile. The
          #       original 4a-vs-production differential was
          #       derived by reading the Makefile and the
          #       workflow YAML and listing variables noticed
          #       to differ — susceptible to the partial-pass-
          #       as-complete-pass pattern the lineage has
          #       caught repeatedly. The bisection has already
          #       eliminated the variables surfaced by the
          #       eyeball version; (C) needs to be mechanical.
          #
          #       Mechanical approach: have the production
          #       build and the bare-stub build both emit
          #       their effective compiler invocations (via
          #       make -n, make CC='echo', or wrapping $CLANG
          #       in a logging script) and diff the two argv
          #       lists. Surfaces every flag difference,
          #       including ones inherited from pkg-config,
          #       environment, sub-makefiles, or anywhere else
          #       they sneak in. Same audit discipline
          #       distinction the lineage has codified:
          #       mechanical-verification beats eyeball-
          #       enumeration for load-bearing inputs.
          #
          #   THEN choose between (A) and (B) based on what
          #   the mechanical differential surfaces:
          #
          #     (A) HARDENING-en-bloc cumulative run.
          #         DESIGN: mechanical — concatenate the four
          #         already-tested-individually HARDENING
          #         flags onto the bare stub, run, verify
          #         whether the combination produces a cell-
          #         1/2/3 result that none of the individual
          #         flags did. Workflow diff is straightforward.
          #         Worth running if the mechanical differential
          #         surfaces no new variables beyond the
          #         original enumeration (i.e. HARDENING is the
          #         only thing that varies, and the individual-
          #         phase elimination rules out single-flag-
          #         carrier but not flag-interaction).
          #
          #     (B) Advance to non-HARDENING variables.
          #         DESIGN: requires prior-ordering of the
          #         variables the mechanical differential
          #         surfaces. Original enumeration's remaining
          #         non-HARDENING categories: TU expansion
          #         (5c), pkg-config-inherited cflags, test
          #         surface. Mechanical differential may add
          #         more.
          #
          #         If (C) surfaces test-surface as a variable
          #         worth eliminating, the pre-staged next run
          #         is the FORCED-TRIP CONTROL CASE: modify
          #         test_util_validators.c to deliberately
          #         plant a buffer-boundary input that
          #         exercises core[in_len] = '\0' under
          #         production CFLAGS, observe whether either
          #         sanitiser fires. This directly validates
          #         the load-bearing assumption registered
          #         since 5a-stkprot: "run 3's status=2
          #         reflects suppression of both sanitisers
          #         on the OOB write, not the test surface
          #         failing to exercise the OOB path." If
          #         neither fires under the forced-trip
          #         control, suppression is real and the
          #         non-test-surface variables advance. If
          #         either fires, the production "suppression"
          #         is actually "test doesn't reach the bug"
          #         and the entire bisection's premise
          #         re-examines.
          #
          # Line-47 invariance: cxx_ge_to_gt AND cxx_ge_to_lt
          # both expected to remain status=2 with empty stderr
          # (parity across 4a, 5b, 5b', 5a-stkprot,
          # 5a-autovarinit, 5a-cfprot). Post-run check both
          # mutators.
          #
          # stderr_len drift check: expected 4784 if cell-4
          # lands. A drift of more than a few bytes despite
          # cell-4 mapping is a finding worth understanding
          # before advancing.
          #
          # Duration trajectory note: 5b' 182ms, 5a-stkprot
          # 395ms, 5a-autovarinit 215ms, 5a-cfprot 108ms. More
          # variance than the stderr_len consistency suggests;
          # likely single-run-on-shared-CI-hardware noise. If
          # 5a-stkclash produces a duration outlier large
          # enough to approach --minimum-timeout 5000, that's
          # a signal worth investigating before attributing
          # to flag mechanism.
          CLANG="clang-${MULL_LLVM_MAJOR}"
          PLUGIN="/usr/lib/mull-ir-frontend-${MULL_LLVM_MAJOR}"
          CFLAGS="-fpass-plugin=$PLUGIN -fsanitize=address,undefined -fno-omit-frame-pointer -g -grecord-command-line -O0 -fstack-clash-protection"
          $CLANG $CFLAGS -c experiment/stub_compose_suppression.c -o /tmp/stub_compose.mull.o
          $CLANG $CFLAGS -c experiment/test_compose_suppression.c -o /tmp/test_compose.mull.o
          $CLANG -fsanitize=address,undefined -fno-omit-frame-pointer -fstack-clash-protection \
              /tmp/stub_compose.mull.o /tmp/test_compose.mull.o \
              -o stub_compose_suppression.mull

      - name: Run mull-runner
        id: mull
        env:
          ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:print_summary=1"
          UBSAN_OPTIONS: "halt_on_error=0:print_stacktrace=1:print_summary=1"
        run: |
          set +e
          "mull-runner-${MULL_LLVM_MAJOR}" \
              --ide-reporter-show-killed \
              --minimum-timeout 5000 \
              --reporters IDE --reporters SQLite \
              --report-dir . \
              --report-name compose-suppression \
              ./stub_compose_suppression.mull > mutation-report.txt 2>&1
          ec=$?
          set -e
          echo "exit=$ec" >> "$GITHUB_OUTPUT"
          {
            echo "## compose-suppression mutation report"
            echo
            echo '```'
            tail -200 mutation-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Query SQLite — survivors, crashes, mutator distribution
        if: always()
        run: |
          if [ ! -f compose-suppression.sqlite ]; then
            echo "::error::compose-suppression.sqlite missing"
            exit 1
          fi
          echo "=== status distribution ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT execution_status, COUNT(*) FROM mutant GROUP BY execution_status ORDER BY execution_status;"
          echo
          echo "=== survivors (status=2): mutator, line, column ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT mutator, line_number, column_number, mutation_replacement FROM mutant WHERE execution_status = 2;"
          echo
          echo "=== crashed (status=4): mutator, line, column ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT mutator, line_number, column_number, mutation_replacement FROM mutant WHERE execution_status = 4;"
          echo
          echo "=== ALL mutants for reference ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT execution_status, mutator, line_number, column_number FROM mutant ORDER BY line_number, column_number;"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compose-suppression-report
          path: |
            mutation-report.txt
            compose-suppression*.sqlite
            compose-suppression*.txt
          retention-days: 30
          if-no-files-found: warn
