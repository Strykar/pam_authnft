name: experiment-compose-suppression
# Throwaway workflow for the mull+ASan stack-instrumentation
# suppression investigation. Runs on the
# experiment/mull-asan-compose-suppression branch only; deleted
# with the branch after the investigation's writeup commits to
# main (docs/MUTATION_ASAN_INVESTIGATION_2.md).
#
# Per-run variables (pass-plugin CLI order, heap vs stack,
# sanitiser flags, optimisation level, mutator filter) change
# between commits on the experiment branch rather than via
# workflow_dispatch inputs — keeps each run a one-line commit
# diff and an auditable git log.
#
# Build is inline rather than Makefile-target-based because the
# stub binary is throwaway; adding a target would land on main
# via the wrong path.
on:
  push:
    branches:
      - experiment/mull-asan-compose-suppression
    paths:
      - 'experiment/stub_compose_suppression.c'
      - 'experiment/test_compose_suppression.c'
      - '.github/workflows/experiment-compose-suppression.yml'
      - 'mull.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  MULL_LLVM_MAJOR: '19'

jobs:
  experiment-compose-suppression:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Install build dependencies
        run: |
          # Run 4a reverts to the bare stub; the production-header
          # cluster from run 3 is not needed. Only the mull repo
          # install dependencies remain.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl gnupg ca-certificates

      - name: Install mull and matching clang
        run: |
          curl -1sLf "https://dl.cloudsmith.io/public/mull-project/mull-stable/setup.deb.sh" \
              -o /tmp/mull-repo.sh
          test "$(wc -l < /tmp/mull-repo.sh)" -lt 1000
          sudo -E bash /tmp/mull-repo.sh
          sudo apt-get install -y \
              "mull-${MULL_LLVM_MAJOR}" "clang-${MULL_LLVM_MAJOR}"
          "mull-runner-${MULL_LLVM_MAJOR}" --version

      - name: Build stub_compose_suppression.mull (run 5a-autovarinit — second HARDENING flag)
        run: |
          # Run 5a-autovarinit: second HARDENING flag in the
          # additive bisection. 5a-stkprot (run ID 26089833756,
          # commit 26ec3b8) landed CELL 4: both sanitisers fired,
          # neither suppressed. -fstack-protector-strong is NOT a
          # contributor to H0' in the bare stub at -O0 with this
          # test surface. Strict sequencing rules: drop the
          # eliminated flag, test the next in isolation against
          # the bare-stub baseline (not against bare-stub +
          # stkprot — carrying nothing forward is just carrying
          # noise).
          #
          # Single-flag, single-variable diff from 5b' (NOT from
          # 5a-stkprot — strict sequencing means each cell-4
          # eliminated flag drops out of the running build):
          # -ftrivial-auto-var-init=zero added at compile AND
          # link (parity with production's same-flags-at-both
          # pattern). Mechanism: clang emits IR-level
          # initialisation of stack locals at function entry,
          # zero-filling uninitialised stack variables. Plausible
          # interaction with ASan stack-instrumentation: the
          # auto-init writes happen at IR level and may run
          # before ASan's red-zone poisoning, potentially
          # changing red-zone semantics or triggering ASan early.
          # Lower-prior than stkprot's stack-reshaping mechanism
          # but still in the plausible-interaction set.
          # UBSAN_OPTIONS stays at halt_on_error=0.
          #
          # Build-flag audit (same shape as previous pre-push
          # audits):
          #   - No -fstack-protector-strong anywhere in workflow
          #     (confirmed: 5a-stkprot's flag fully removed).
          #   - No -fstack-clash-protection anywhere in workflow.
          #   - No -fcf-protection anywhere in workflow.
          #   - No -fno-strict-overflow anywhere in workflow.
          #   - No -ftrivial-auto-var-init already present
          #     (would indicate inheritance from elsewhere).
          # Build is per-file inline clang, not Makefile-driven,
          # so no CFLAGS_BASE inheritance. The flag added here
          # is the only HARDENING variable in play.
          #
          # H0' framing unchanged: production shows BOTH
          # sanitisers suppressed; success condition is "both
          # stop firing", not "ASan stops firing."
          #
          # Verdict for line-51 cxx_ge_to_gt. Five interpretive
          # cells, structurally identical to 5a-stkprot's with
          # the flag name substituted (autovarinit ↔ stkprot):
          #
          #   CELL 1 (2, stderr empty):
          #     Full H0' reproduction. -ftrivial-auto-var-init
          #     =zero is SUFFICIENT to suppress both sanitisers
          #     in the bare-stub compose at -O0. Pause and
          #     write up.
          #
          #   CELL 2 (1, UBSan diagnostic only, no ASan block,
          #           no "ABORTING"):
          #     Partial reproduction. UBSan still fires, ASan
          #     suppressed. -ftrivial-auto-var-init=zero is a
          #     NECESSARY-BUT-NOT-SUFFICIENT contributor.
          #     Bisection model shifts to cumulative-additive:
          #     next run is 5a-autovarinit + 5a-cfprot (or
          #     autovarinit + stkclash, prior-ordered). The
          #     cumulative set starts with autovarinit alone;
          #     previously-eliminated flags (stkprot) stay
          #     eliminated and do NOT re-enter the build. The
          #     next run's verdict mapping reframes from "is
          #     this flag the carrier" to "does this flag,
          #     added to autovarinit, advance H0' reproduction
          #     further" — pre-stated in the cell-2 commit at
          #     run time, not inherited from this run's mapping.
          #
          #   CELL 3 (1, ASan diagnostic block + "ABORTING",
          #           no UBSan):
          #     Surprising. autovarinit×UBSan interaction;
          #     stronger pause (same shape as 5a-stkprot cell 3):
          #     the bisection model's additivity assumption is
          #     wrong for this flag combination, and continuing
          #     without characterising the interaction would
          #     compound uncharacterised variables across
          #     subsequent runs.
          #
          #   CELL 4 (1, UBSan diagnostic then ASan block +
          #           "ABORTING", two cleanly separated blocks
          #           like 5b' and 5a-stkprot):
          #     No effect on either sanitiser. autovarinit is
          #     NOT a contributor to H0' in the bare stub at
          #     -O0 with this test surface. Eliminate; advance
          #     to 5a-cfprot as the next single-variable
          #     additive run.
          #
          #   CELL 5 (any, INTERLEAVED diagnostics):
          #     Attribution not safe; treat as needs-follow-up.
          #
          #   (4, _), (5, _), (3, _):
          #     Attribute from stderr column.
          #
          # Three-option branching pre-stated for the "all four
          # HARDENING flags individually eliminate" scenario
          # (4×cell-4 across 5a-stkprot, 5a-autovarinit,
          # 5a-cfprot, 5a-stkclash). Already one cell-4 banked
          # at 5a-stkprot; if the remaining three also land
          # cell 4, the decision is NOT automatically "advance
          # to HARDENING en-bloc". Three options to weigh under
          # whatever evidence the bisection has produced by
          # that point:
          #     (A) HARDENING-en-bloc cumulative run. Tests
          #         whether two or more HARDENING flags only
          #         suppress when present together (flag
          #         interaction). Distinct from any of the
          #         individual runs.
          #     (B) Advance to other variables in the 4a-vs-
          #         production differential: TU expansion (5c),
          #         pkg-config-inherited cflags, build-path
          #         differences. HARDENING is not the
          #         contributor; something else is.
          #     (C) Re-derive the 4a-vs-production differential
          #         before concluding HARDENING-en-bloc is the
          #         next step. The initial differential may be
          #         incomplete; the contributor may be a
          #         variable that wasn't surfaced in the first
          #         pass.
          # The post-4×cell-4 decision is between these three
          # options, not "obviously do en-bloc next."
          #
          # Line-47 invariance: cxx_ge_to_gt AND cxx_ge_to_lt
          # both expected to remain status=2 with empty stderr
          # (parity across 4a, 5b, 5b', 5a-stkprot). Post-run
          # check both mutators.
          #
          # Load-bearing assumption (unchanged from 5a-stkprot):
          # run 3's status=2 reflects suppression of both
          # sanitisers on the OOB write, not the test surface
          # failing to exercise the OOB path. Pre-planned
          # verification (if writeup turns up contradicting
          # evidence): modify test_util_validators.c to plant
          # a buffer-boundary input under production CFLAGS,
          # observe whether either sanitiser fires.
          CLANG="clang-${MULL_LLVM_MAJOR}"
          PLUGIN="/usr/lib/mull-ir-frontend-${MULL_LLVM_MAJOR}"
          CFLAGS="-fpass-plugin=$PLUGIN -fsanitize=address,undefined -fno-omit-frame-pointer -g -grecord-command-line -O0 -ftrivial-auto-var-init=zero"
          $CLANG $CFLAGS -c experiment/stub_compose_suppression.c -o /tmp/stub_compose.mull.o
          $CLANG $CFLAGS -c experiment/test_compose_suppression.c -o /tmp/test_compose.mull.o
          $CLANG -fsanitize=address,undefined -fno-omit-frame-pointer -ftrivial-auto-var-init=zero \
              /tmp/stub_compose.mull.o /tmp/test_compose.mull.o \
              -o stub_compose_suppression.mull

      - name: Run mull-runner
        id: mull
        env:
          ASAN_OPTIONS: "abort_on_error=1:halt_on_error=1:print_summary=1"
          UBSAN_OPTIONS: "halt_on_error=0:print_stacktrace=1:print_summary=1"
        run: |
          set +e
          "mull-runner-${MULL_LLVM_MAJOR}" \
              --ide-reporter-show-killed \
              --minimum-timeout 5000 \
              --reporters IDE --reporters SQLite \
              --report-dir . \
              --report-name compose-suppression \
              ./stub_compose_suppression.mull > mutation-report.txt 2>&1
          ec=$?
          set -e
          echo "exit=$ec" >> "$GITHUB_OUTPUT"
          {
            echo "## compose-suppression mutation report"
            echo
            echo '```'
            tail -200 mutation-report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Query SQLite — survivors, crashes, mutator distribution
        if: always()
        run: |
          if [ ! -f compose-suppression.sqlite ]; then
            echo "::error::compose-suppression.sqlite missing"
            exit 1
          fi
          echo "=== status distribution ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT execution_status, COUNT(*) FROM mutant GROUP BY execution_status ORDER BY execution_status;"
          echo
          echo "=== survivors (status=2): mutator, line, column ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT mutator, line_number, column_number, mutation_replacement FROM mutant WHERE execution_status = 2;"
          echo
          echo "=== crashed (status=4): mutator, line, column ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT mutator, line_number, column_number, mutation_replacement FROM mutant WHERE execution_status = 4;"
          echo
          echo "=== ALL mutants for reference ==="
          sqlite3 compose-suppression.sqlite \
            "SELECT execution_status, mutator, line_number, column_number FROM mutant ORDER BY line_number, column_number;"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: compose-suppression-report
          path: |
            mutation-report.txt
            compose-suppression*.sqlite
            compose-suppression*.txt
          retention-days: 30
          if-no-files-found: warn
