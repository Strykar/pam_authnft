name: fuzz-coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # One in-flight run per PR (github.ref is refs/pull/<n>/merge on a PR, so
  # PRs never cancel each other and push-to-main sits in its own group). The
  # cancel only fires for pull_request events, so a push to main or a cron run
  # is never interrupted mid-flight. Workflow-level, not job-level: a matrix
  # job with a matrix-blind group key would cancel its own sibling leg and
  # report 'cancelled' on the head SHA, which branch protection blocks on.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  coverage-gate:
    # Deterministic per-function >=90% region-coverage gate on the fuzzed
    # functions. Builds the coverage harnesses and replays only the committed
    # corpus (no timed fuzz), so a change that drops a fuzzed function below the
    # bar fails here. Security goal #1 (memory safety in every parser of
    # attacker-influenced bytes) leans on this coverage holding.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0   # the scope probe below diffs against the PR base

      - id: scope
        uses: ./.github/actions/fuzz-scope
      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang llvm pkg-config \
            libnftables-dev libseccomp-dev libsystemd-dev libpam0g-dev libcap-dev libaudit-dev
      - name: Per-function fuzz-coverage gate
        if: steps.scope.outputs.relevant == 'true'
        run: make fuzz-coverage-gate
