name: fuzz-nightly
# Sustained fuzzing — finds bugs that the per-PR 60-second CIFuzz
# window can't reach. Runs every harness for 30 minutes against the
# corpus checked in at tests/fuzz/corpus/. On a crash, files an issue on
# the repo with the harness name, the ASan/UBSan output, and the
# minimized reproducer attached as a workflow artefact.
#
# Triggers:
#   - schedule: daily at 03:17 UTC (off-peak)
#   - workflow_dispatch: manual button on the Actions tab
#
# Cost note: ~30 min × 8 harnesses × 1 ubuntu-latest runner = ~4 hr/day
# of free-tier minutes. Public repos get unlimited; private repos
# would burn ~120 hr/month — switch to runs-on: self-hosted in that
# case. See docs/CONTRIBUTING.txt §Sustained fuzz.
on:
  schedule:
    # 03:17 UTC daily. Cron shifts in busy periods, so the offset
    # avoids piling onto the top-of-hour cron crowd.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: 'Per-harness fuzz duration (seconds)'
        required: false
        default: '1800'
        type: string

permissions:
  # contents:read for checkout, and nothing else. issues:write lives on the
  # report job alone, so no write capability is in scope while the fuzz
  # targets execute.
  contents: read

env:
  # Leak detection needs ptrace which GitHub Actions runners deny.
  ASAN_OPTIONS: detect_leaks=0
  # Default duration when not on workflow_dispatch.
  FUZZ_SECONDS: '1800'

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      # Each harness gets its own job slot — they run in parallel and
      # one crash doesn't stop the others. Easier to triage than a
      # single 4-hour serial run.
      matrix:
        harness:
          - fuzz_username
          - fuzz_fragment
          - fuzz_substitute_placeholders
          - fuzz_netlink_diag
          - fuzz_keyring_sanitize
          - fuzz_correlation_capture
          - fuzz_cgroup_path
          - fuzz_socket_inode

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang pkg-config \
            libnftables-dev libseccomp-dev libsystemd-dev libpam0g-dev libcap-dev libaudit-dev

      - name: Build fuzz targets
        run: make fuzz

      - name: Resolve fuzz duration
        id: duration
        env:
          # Via env, not inline ${{ }}: the dispatch input is caller-supplied,
          # and interpolating it straight into the script would let a dispatcher
          # inject shell. As a variable it is data, never code.
          DURATION_INPUT: ${{ github.event.inputs.duration_seconds }}
        run: |
          dur="$DURATION_INPUT"
          if [ -z "$dur" ]; then dur="${FUZZ_SECONDS}"; fi
          echo "seconds=$dur" >> "$GITHUB_OUTPUT"
          echo "Fuzzing ${{ matrix.harness }} for $dur seconds"

      # Restore the corpus this harness accumulated on previous nights so
      # coverage compounds instead of restarting from the committed seeds every
      # time. Keyed per harness (the eight corpora are unrelated) on the run id,
      # which never matches on restore, so restore-keys falls back to the most
      # recently saved cache for this harness and the save below always writes a
      # fresh key. A PR run's cache is scoped to its own merge ref and cannot be
      # restored here, so no fork PR can seed what the nightly fuzzes.
      - name: Restore corpus cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fuzz/corpus-cache/${{ matrix.harness }}
          key: fuzz-corpus-${{ matrix.harness }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.harness }}-

      - name: Fuzz ${{ matrix.harness }}
        id: fuzz
        run: |
          mkdir -p tests/fuzz/crashes "tests/fuzz/corpus-cache/${HARNESS_NAME}"
          seed_dir="tests/fuzz/corpus/${HARNESS_NAME#fuzz_}"
          [ -d "$seed_dir" ] || seed_dir=""
          # libFuzzer writes newly discovered inputs into the FIRST corpus dir
          # on argv, so the persisted cache dir goes first and the git-tracked
          # seeds second — tests/fuzz/corpus/ is only read, never written, which keeps
          # it out of the way of the coverage gate that replays it.
          # libFuzzer exit codes:
          #   0   timed-out cleanly (-max_total_time)
          #   77  crash (the bug we want)
          #   any other non-zero — assume crash too
          set +e
          ./tests/fuzz/out/${HARNESS_NAME} \
            -max_total_time=${SECONDS_LIMIT} \
            -artifact_prefix=tests/fuzz/crashes/${HARNESS_NAME}- \
            "tests/fuzz/corpus-cache/${HARNESS_NAME}" $seed_dir \
            > tests/fuzz/crashes/${HARNESS_NAME}.log 2>&1
          ec=$?
          set -e
          echo "exit=$ec" >> "$GITHUB_OUTPUT"
          # The report job has no workspace and no step outputs from this
          # matrix leg, so the exit code rides along in the artefact.
          echo "$ec" > "tests/fuzz/crashes/${HARNESS_NAME}.exit"
          if [ "$ec" -ne 0 ]; then
            echo "::warning::${HARNESS_NAME} exited $ec — crash artefact uploaded"
            tail -200 tests/fuzz/crashes/${HARNESS_NAME}.log
            exit 1
          fi
        env:
          HARNESS_NAME: ${{ matrix.harness }}
          SECONDS_LIMIT: ${{ steps.duration.outputs.seconds }}

      - name: Minimize corpus before save
        # Only on a clean run: a crashing binary cannot -merge. On a crash the
        # raw discovered corpus is saved as-is by the next step. -merge=1 copies
        # only coverage-increasing inputs into an empty dir, bounding growth
        # against the cache size limit. The cache dir is emptied in place with
        # find -delete and refilled — no recursive remove of a computed path.
        if: steps.fuzz.outputs.exit == '0'
        env:
          HARNESS_NAME: ${{ matrix.harness }}
        run: |
          set -euo pipefail
          cache_dir="tests/fuzz/corpus-cache/${HARNESS_NAME}"
          [ -d "$cache_dir" ] || exit 0
          min="$(mktemp -d)"
          ./tests/fuzz/out/${HARNESS_NAME} -merge=1 "$min" "$cache_dir"
          find "$cache_dir" -mindepth 1 -delete
          cp -a "$min/." "$cache_dir/"

      - name: Save corpus cache
        # always() so a crash night (the fuzz step exits 1 and fails the job)
        # still persists what was discovered. The combined actions/cache
        # post-save is skipped after a failed step; save-always is deprecated
        # and does not run, so restore and save are kept as separate actions.
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tests/fuzz/corpus-cache/${{ matrix.harness }}
          key: fuzz-corpus-${{ matrix.harness }}-${{ github.run_id }}

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.harness }}-artefacts
          path: |
            tests/fuzz/crashes/
          retention-days: 14

  # Reporting is a separate job so the token that can write issues is never
  # live while the harnesses run. Fuzzing is the deliberate practice of
  # feeding hostile input to this code looking for memory corruption; if a
  # harness ever loses that argument, the process should not be sitting in a
  # job holding issues:write. This job checks nothing out and reads no repo
  # code: everything it needs travels in the artefacts the fuzz legs upload.
  report:
    needs: fuzz
    if: always() && needs.fuzz.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # The only write in this workflow, on the one job that does nothing but
      # call the issues API. contents is not granted: there is no checkout,
      # and same-run artefact download needs no permission of its own.
      issues: write

    steps:
      - name: Download the fuzz artefacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-artefacts'
          path: artefacts
          # Without this, download-artifact only creates a directory per
          # artefact when more than one matches (the path is resolvedPath when
          # `artifacts.length === 1`), so the layout would change shape on a
          # run where only one leg uploaded. Merged, it is always flat, and
          # every file a leg writes is already prefixed with its harness name.
          merge-multiple: true

      - name: File crash issues
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const root = 'artefacts';

            // Every leg's files land here together, each already named for its
            // harness: <harness>.log, <harness>.exit, <harness>-crash-<sha>.
            let files = [];
            try {
              files = fs.readdirSync(root);
            } catch (e) {
              core.setFailed(`no artefacts to read: ${e.message}`);
              return;
            }

            // Walk the fixed list, never the directory. A harness that got
            // far enough to run attacker code can write any filename it likes
            // under tests/fuzz/crashes, and that lands in the artefact this
            // job reads while holding issues:write. Taking names from the
            // matrix instead of from the artefact keeps the set of issues this
            // can ever open bounded, which is the whole point of the split.
            // Anything the fuzz job produces is forgeable under compromise,
            // including $GITHUB_OUTPUT; the workflow definition is not.
            // Keep in step with strategy.matrix.harness above:
            // tests/ci/fuzz-report-test.js fails if the two diverge.
            const HARNESSES = [
              'fuzz_username',
              'fuzz_fragment',
              'fuzz_substitute_placeholders',
              'fuzz_netlink_diag',
              'fuzz_keyring_sanitize',
              'fuzz_correlation_capture',
              'fuzz_cgroup_path',
              'fuzz_socket_inode',
            ];

            // .exit carries the fuzz step's exit code across the job boundary.
            // A leg with no .exit never reached the fuzz step, so the failure
            // was the runner or the build, not a crash. The scheduled run is
            // red either way; filing "<harness> crashed" for it would lie.
            const crashed = [];
            for (const harness of HARNESSES) {
              let ec;
              try { ec = fs.readFileSync(`${root}/${harness}.exit`, 'utf8').trim(); }
              catch (e) { continue; }
              if (ec !== '0') crashed.push(harness);
            }

            if (crashed.length === 0) {
              core.warning('fuzz failed but no harness recorded a non-zero exit; look at the run itself');
              return;
            }

            // Don't spam: if an open issue with the same title already
            // exists, just add a comment with the new run link.
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'fuzz-crash',
              per_page: 100,
            });

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            for (const harness of crashed) {
              let log = '';
              try { log = fs.readFileSync(`${root}/${harness}.log`, 'utf8').slice(-8000); }
              catch (e) { log = '(log unavailable)'; }

              // Find the crash artefact (libFuzzer writes crash-<sha>).
              const saved = files.filter(f => f.startsWith(`${harness}-crash-`));
              const artefact = saved.length ? saved.join(', ') : '(none)';

              const title = `[fuzz-nightly] ${harness} crashed`;
              const body = [
                `**Harness:** \`${harness}\``,
                `**Workflow run:** ${runUrl}`,
                `**Crash artefact filename(s):** \`${artefact}\``,
                ``,
                `Crash artefacts are attached to the workflow run as`,
                `\`${harness}-artefacts\` (14-day retention).`,
                ``,
                `Last 8KB of stderr/stdout:`,
                '```',
                log,
                '```',
                ``,
                `Triage: download the artefact, save the \`crash-*\` input,`,
                `replay locally with`,
                `\`./tests/fuzz/out/${harness} <crash-input>\`. Add the input to`,
                `\`tests/fuzz/corpus/${harness.replace('fuzz_', '')}/regression_*\``,
                `once the underlying bug is fixed.`,
              ].join('\n');

              const existing = issues.find(i => i.title === title);
              if (existing) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  body: `Crash recurred — ${runUrl}`,
                });
              } else {
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title,
                  body,
                  labels: ['fuzz-crash', 'bug'],
                });
              }
            }
