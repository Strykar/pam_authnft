name: integration

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

concurrency:
  # One in-flight run per PR (github.ref is refs/pull/<n>/merge on a PR, so
  # PRs never cancel each other and push-to-main sits in its own group). The
  # cancel only fires for pull_request events, so a push to main or a cron run
  # is never interrupted mid-flight. Workflow-level, not job-level: a matrix
  # job with a matrix-blind group key would cancel its own sibling leg and
  # report 'cancelled' on the head SHA, which branch protection blocks on.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  container-integration:
    # Tier 1 (docs/CI_LOCAL.md): the 25-stage integration suite and the
    # fault-injection matrix run inside the booted-systemd container defined by
    # Containerfile. A GitHub-hosted ubuntu-latest runner is a full VM with
    # systemd as PID 1, so the container's transient-scope creation and the
    # pamtester open/close lifecycle work here.
    #
    # The container shares the runner's kernel, so the `socket cgroupv2 level 2`
    # packet-match (integration stage 10.11) is validated against the runner
    # image's kernel, not a pinned matrix. The kernel matrix lives in
    # the container tier.
    #
    # Cadence: per PR (plus dispatch + nightly). The systemd-in-podman boot was
    # proven green on a hosted runner before promoting this to a PR gate; that
    # run also surfaced and fixed the runner's lack of Containerfile-heredoc
    # support (scripts moved to tests/container/ and COPY'd).
    strategy:
      fail-fast: false
      matrix:
        # test-integration-container: pamtester lifecycle, leftover-state,
        #   rollback, session-file perms, real-sshd loopback.
        # audit-container: the five nft_handler_setup returns under ASan/LSan
        #   plus the valgrind lifecycle (catches the frag_buf leak class).
        target: [test-integration-container, audit-container]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the scope probe below diffs against the PR base

      - id: scope
        uses: ./.github/actions/docs-only
      - name: Install podman
        if: steps.scope.outputs.result != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman
      - name: Run ${{ matrix.target }} (booted-systemd container)
        if: steps.scope.outputs.result != 'true'
        # If the systemd-init container fails to boot under rootless podman on
        # the hosted image, switch this to `sudo make ${{ matrix.target }}`
        # (rootful podman). This is the unproven step called out above.
        run: make ${{ matrix.target }}
