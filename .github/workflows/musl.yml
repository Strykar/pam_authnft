name: musl

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # One in-flight run per PR (github.ref is refs/pull/<n>/merge on a PR, so
  # PRs never cancel each other and push-to-main sits in its own group). The
  # cancel only fires for pull_request events, so a push to main or a cron run
  # is never interrupted mid-flight. Workflow-level, not job-level: a matrix
  # job with a matrix-blind group key would cancel its own sibling leg and
  # report 'cancelled' on the head SHA, which branch protection blocks on.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  musl-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0   # the scope probe below diffs against the PR base

      - id: scope
        uses: ./.github/actions/docs-only
      - name: build + unit suite on musl (Alpine)
        if: steps.scope.outputs.result != 'true'
        # Builds pam_authnft against musl and runs the unit suite, whose
        # Stage 13 exercises the setup-path syscalls under the sandbox. Catches
        # libc-specific seccomp allowlist gaps (open/readv/writev class) that
        # the glibc-only jobs cannot. Reuses the same script as `make test-musl`.
        run: CONTAINER_ENGINE=docker tests/ci/musl-test.sh "$GITHUB_WORKSPACE"
