name: reproducibility

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # One in-flight run per PR (github.ref is refs/pull/<n>/merge on a PR, so
  # PRs never cancel each other and push-to-main sits in its own group). The
  # cancel only fires for pull_request events, so a push to main or a cron run
  # is never interrupted mid-flight. Workflow-level, not job-level: a matrix
  # job with a matrix-blind group key would cancel its own sibling leg and
  # report 'cancelled' on the head SHA, which branch protection blocks on.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reproducible-build:
    # Security goal #7: same-machine reproducible builds. Builds pam_authnft.so
    # twice from a clean tree and compares the sha256; `make
    # reproducibility-check` exits non-zero on a mismatch. The build embeds no
    # timestamps or random seeds, so this is deterministic on a fixed
    # toolchain. If the hosted runner's toolchain ever proves non-reproducible,
    # pin SOURCE_DATE_EPOCH or the compiler version here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # the scope probe below diffs against the PR base

      - id: scope
        uses: ./.github/actions/docs-only
      - name: Install dependencies
        if: steps.scope.outputs.result != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libnftables-dev libseccomp-dev libsystemd-dev libpam0g-dev libcap-dev libaudit-dev
      - name: Reproducible same-machine build
        if: steps.scope.outputs.result != 'true'
        run: make reproducibility-check
