name: sbom

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    # Ship a CycloneDX SBOM with every release. Builds pam_authnft.so and runs
    # `make sbom` (syft scan of the shipped .so), then attaches the result to
    # the release. On workflow_dispatch it only generates the SBOM (no attach)
    # so the job can be smoke-tested without a release.
    permissions:
      contents: write   # attach the SBOM asset to the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libnftables-dev libseccomp-dev libsystemd-dev libpam0g-dev libcap-dev libaudit-dev
      - name: Install syft (pinned)
        # The installer script is pinned to the commit the v1.46.0 tag points
        # at, so the piped-to-sh script is immutable (raw .../main/ served a
        # mutable script into a contents:write job). The binary version is
        # pinned to the same release.
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/b15c5dbfe2bb21c9d73002c1056a829c8c411c75/install.sh \
            | sh -s -- -b "$HOME/.local/bin" v1.46.0
      - name: Build and generate the CycloneDX SBOM
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          make all
          make sbom
      - name: Attach the SBOM to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" pam_authnft.cdx.json --clobber
